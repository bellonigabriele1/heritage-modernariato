<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-som" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecebe5"/>
      <stop offset="1" stop-color="#d2cfc2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4892f"/>
      <stop offset="0.5" stop-color="#8a3a2e"/>
      <stop offset="1" stop-color="#4a1818"/>
    </linearGradient>
    <linearGradient id="amber-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5a548" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5a2418" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-som)"/>
  <ellipse cx="400" cy="510" rx="140" ry="12" fill="#000" opacity="0.12"/>
  <!-- bottle shape: narrow neck, wider body -->
  <path d="M 370 160
           L 370 200
           Q 360 220 340 240
           Q 290 280 290 360
           Q 290 460 320 490
           L 480 490
           Q 510 460 510 360
           Q 510 280 460 240
           Q 440 220 430 200
           L 430 160
           Z"
        fill="url(#amber)"/>
  <!-- inner sommerso layer -->
  <ellipse cx="400" cy="380" rx="80" ry="100" fill="url(#amber-inner)" opacity="0.7"/>
  <!-- opening -->
  <ellipse cx="400" cy="160" rx="30" ry="6" fill="#2a0e0a"/>
  <!-- highlights -->
  <path d="M 320 280 Q 305 380 320 470" stroke="#fff" stroke-width="5" fill="none" opacity="0.45"/>
  <path d="M 470 250 Q 465 320 470 400" stroke="#fff" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
